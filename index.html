<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charlie Ho 何汝翔 | Oboist & Music Educator</title>
<style>
  body {
    background-color: #0f1211;
    color: #dfba73;
    font-family: 'Baskerville', 'Georgia', 'Noto Serif TC', serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }

  .bg-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: radial-gradient(circle at 80% 20%, rgba(223, 186, 115, 0.08) 0%, transparent 50%);
    z-index: -1;
  }

  .main-container {
    width: 100%;
    max-width: 440px;
    padding: 40px 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 3D 翻轉名片 */
  .card-flip-wrapper {
    width: 100%;
    height: 220px;
    perspective: 1000px;
    margin-bottom: 30px;
    cursor: pointer;
  }

  .card-inner {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    border-radius: 12px;
  }

  .card-flip-wrapper.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .v-card {
    position: absolute;
    width: 100%; height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    border: 1px solid rgba(223, 186, 115, 0.2);
    box-sizing: border-box;
    padding: 25px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .v-card-front { background: linear-gradient(135deg, #1a1a1a 0%, #111a18 100%); }
  .v-card-back { background: linear-gradient(135deg, #111a18 0%, #1a1a1a 100%); transform: rotateY(180deg); justify-content: center; gap: 10px; }

  .v-card-front .name { font-size: 20px; font-weight: bold; }
  .v-card-front .title { font-size: 12px; font-style: italic; color: #fff; opacity: 0.8; }

  /* 快速聯絡按鈕 */
  .action-buttons { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-bottom: 35px; }
  .action-btn {
    background: rgba(28, 28, 28, 0.6);
    backdrop-filter: blur(10px);
    color: #ffffff;
    border: 1px solid rgba(223, 186, 115, 0.25);
    border-radius: 16px;
    padding: 16px 24px;
    font-size: 15px;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* ==========================================================================
     【全新加入】專屬金色 QR Code 顯示區塊
     ========================================================================== */
  .qrcode-section {
    width: 100%;
    background: rgba(25, 25, 25, 0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(223, 186, 115, 0.15);
    border-radius: 20px;
    padding: 25px;
    box-sizing: border-box;
    text-align: center;
    margin-bottom: 25px;
  }

  .qrcode-container {
    background: #0f1211;
    padding: 15px;
    display: inline-block;
    border-radius: 12px;
    border: 1px solid rgba(223, 186, 115, 0.3);
    margin-top: 10px;
  }

  .qrcode-container img {
    display: block;
    width: 180px;
    height: 180px;
  }

  .copy-badge { font-size: 10px; background: rgba(223, 186, 115, 0.2); color: #dfba73; padding: 2px 8px; border-radius: 10px; }
</style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="main-container">

    <!-- 1️⃣ 3D 名片 -->
    <div class="card-flip-wrapper" onclick="toggleCardFlip(this)">
      <div class="card-inner">
        <div class="v-card v-card-front">
          <div style="font-size: 50px; opacity: 0.15;">𝄞</div>
          <div style="text-align: right;">
            <div class="name">Ho Yu Cheung, Charlie</div>
            <div class="name" style="font-size:16px;">何汝翔</div>
            <div class="title">Oboist & Music Educator</div>
          </div>
          <div style="font-size: 10px; opacity: 0.5; text-align: center;">💡 點擊卡片可翻看專業資格</div>
        </div>
        <div class="v-card v-card-back">
          <div>
            <div style="font-size:11px; font-weight:bold; border-bottom:1px solid rgba(223,186,115,0.3);">QUALIFICATIONS</div>
            <div style="font-size:11px; opacity:0.85; margin-top:5px;">• LTCL (Recital in Oboe) — 2014</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2️⃣ 快捷鍵 -->
    <div class="action-buttons">
      <a href="https://wa.me/85261566957" target="_blank" class="action-btn">
        <span>💬 WhatsApp 聯絡我</span><span>➔</span>
      </a>
      <a href="tel:+85261566957" class="action-btn">
        <span>📞 撥打手機聯絡</span><span>➔</span>
      </a>
      <a href="javascript:void(0);" onclick="copyEmail()" class="action-btn">
        <span>📧 charlie.oboe.hk@gmail.com</span><span class="copy-badge" id="copyLabel">複製</span>
      </a>
    </div>

    <!-- 3️⃣ 全新 QR Code 區塊 -->
    <div class="qrcode-section">
      <div style="font-size: 14px; font-weight: bold; letter-spacing: 1px;">分享我的電子卡片</div>
      <div style="font-size: 11px; opacity: 0.6; margin-top: 4px;">讓家長或樂團團員直接掃描此碼</div>
      <div class="qrcode-container">
        <!-- 這裡動態引入了配合網頁黑金風格的金色 QR Code 接口 -->
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https%3A%2F%2Fcharlie-oboe.github.io&color=dfba73&bgcolor=0f1211" alt="QR Code">
      </div>
    </div>

  </div>

  <script>
    function toggleCardFlip(wrapper) { wrapper.classList.toggle('flipped'); }
    function copyEmail() {
      navigator.clipboard.writeText("charlie.oboe.hk@gmail.com").then(() => {
        const badge = document.getElementById('copyLabel');
        badge.innerText = "已複製！";
        setTimeout(() => { badge.innerText = "複製"; }, 2000);
      });
    }
  </script>

</body>
</html>
